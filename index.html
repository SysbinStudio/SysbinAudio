<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sysbin Audio Web - 完全开源，纯前端制作</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- 顶部主菜单栏 -->
<div class="top-bar">
  <div class="logo">Sysbin Audio Web <span style="font-size:12px;opacity:.7;margin-left:10px;font-weight:400">完全开源 · 纯前端制作</span></div>
  <div class="menu-group">
    <div class="menu-wrap">
      <button class="menu-btn" data-menu="fileMenu">文件</button>
      <div class="dropdown-menu" id="fileMenu">
        <div class="menu-item" id="newProj">新建工程</div>
        <div class="menu-item" id="loadProj">加载工程</div>
        <div class="menu-item" id="saveProj">保存工程</div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menuImport">导入音频</div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menuExport">导出WAV</div>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="menu-btn" data-menu="editMenu">编辑</button>
      <div class="dropdown-menu" id="editMenu">
        <div class="menu-item" id="menuUndo">撤销 (Ctrl+Z)</div>
        <div class="menu-item" id="menuCut">分割片段</div>
        <div class="menu-item" id="menuDel">删除选区</div>
        <div class="menu-divider"></div>
        <div class="menu-item" id="menuCopy">复制</div>
        <div class="menu-item" id="menuPaste">粘贴</div>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="menu-btn" data-menu="toolMenu">工具</button>
      <div class="dropdown-menu" id="toolMenu">
        <div class="menu-item">均衡器EQ</div>
        <div class="menu-item">变速变调</div>
        <div class="menu-item">淡入淡出</div>
        <div class="menu-divider"></div>
        <div class="menu-item">网格吸附开关</div>
      </div>
    </div>
    <div class="menu-wrap">
      <button class="menu-btn" data-menu="exportMenu">导出</button>
      <div class="dropdown-menu" id="exportMenu">
        <div class="menu-item">导出WAV混音</div>
        <div class="menu-item">导出单轨道音频</div>
      </div>
    </div>
  </div>

  <!-- 播放控制台 Transport -->
  <div class="transport">
    <button id="stopBtn" title="停止">■</button>
    <button id="playBtn" title="播放/暂停">▶</button>
    <button id="loopBtn" title="循环播放">⟳</button>
    <span>BPM:</span>
    <input type="number" id="bpmInput" value="128" min="40" max="240" step="1">
    <span>网格吸附</span>
    <input type="checkbox" id="snapSnap">
  </div>

  <!-- 全局主音量推子 -->
  <div class="volume-main">
    主音量
    <input type="range" id="masterVol" min="0" max="1" step="0.01" value="0.8">
    <span id="masterVolNum">0.80</span>
  </div>
</div>

<!-- 全局遮罩：点击空白关闭下拉菜单 -->
<div class="menu-mask" id="menuMask"></div>

<!-- 三栏主布局 -->
<div class="layout-wrap">
  <!-- 左侧轨道通道面板 -->
  <div class="track-list">
    <div class="track-head">轨道通道</div>
    <div id="trackContainer"></div>
    <div class="track-bottom-btn-group">
      <button id="addTrackBtn">+ 新建音频轨道</button>
      <button id="importBtn" class="track-import-btn">导入音频素材</button>
    </div>
  </div>

  <!-- 中间主编辑区：标尺+波形轨道编辑器 -->
  <div class="editor-main">
    <!-- 顶部时间标尺 -->
    <div class="ruler-wrap">
      <div class="ruler" id="rulerCanvas"></div>
      <!-- 缩放滚轮控制层 -->
      <div class="zoom-control">
        <span>缩放</span>
        <input type="range" id="zoomSlider" min="0.3" max="3" step="0.05" value="1">
      </div>
    </div>
    <!-- 波形编辑滚动容器 -->
    <div class="clip-editor" id="clipEditor"></div>
    <!-- 底部状态栏 -->
    <div class="status-bar">
      <span>当前播放时间：<span id="timeText">00:00.00</span></span>
      <span>选区范围：<span id="selText">无</span></span>
      <span id="loopStatus"></span>
      <span>缩放倍率：<span id="zoomText">100%</span></span>
    </div>
  </div>

  <!-- 右侧效果机架面板 -->
  <div class="fx-panel">
    <div class="fx-title">效果机架</div>
    <!-- 三段均衡EQ -->
    <div class="eq-box">
      <h4>三段均衡 EQ</h4>
      <div class="eq-slider">
        <span>低频增益</span>
        <input type="range" id="eqLow" min="-12" max="12" value="0">
        <span class="eqVal" id="eqLowVal">0dB</span>
      </div>
      <div class="eq-slider">
        <span>中频增益</span>
        <input type="range" id="eqMid" min="-12" max="12" value="0">
        <span class="eqVal" id="eqMidVal">0dB</span>
      </div>
      <div class="eq-slider">
        <span>高频增益</span>
        <input type="range" id="eqHigh" min="-12" max="12" value="0">
        <span class="eqVal" id="eqHighVal">0dB</span>
      </div>
    </div>
    <!-- 变速变调模块 -->
    <div class="speed-box">
      <h4>变速变调</h4>
      <div class="eq-slider">
        <span>播放速度</span>
        <input type="range" id="speedSlider" min="0.5" max="2" step="0.01" value="1">
        <span class="eqVal" id="speedVal">1.00x</span>
      </div>
    </div>
    <!-- 片段编辑工具 -->
    <div class="tool-buttons">
      <button id="cutBtn">分割选区</button>
      <button id="delBtn">删除选区</button>
      <button id="undoBtn">撤销</button>
      <button id="exportBtn">导出WAV</button>
    </div>
    <!-- 淡入淡出工具 -->
    <div class="fade-box">
      <h4>音量包络</h4>
      <button id="fadeInBtn">淡入</button>
      <button id="fadeOutBtn">淡出</button>
    </div>
  </div>
</div>

<!-- 隐藏文件上传控件 -->
<input type="file" id="audioUpload" accept="audio/*" multiple hidden>
<input type="file" id="projLoadUpload" accept=".json" hidden>
<a id="projDownloadLink" hidden></a>

<script src="app.js"></script>
</body>
</html>
